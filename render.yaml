databases:
  - name: next-in-dining-db
    plan: free
    postgresMajorVersion: "16"

services:
  # Production: promoted manually from dev, backed by the managed Postgres.
  - type: web
    name: next-in-dining
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: next-in-dining-db
          property: connectionString

  # Development: deployed by CI on every push to main. Render's free plan
  # allows a single free Postgres, so dev uses the default SQLite file,
  # which is recreated (and re-seeded) on every deploy.
  - type: web
    name: next-in-dining-dev
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: development
