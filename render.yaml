databases:
  - name: next-in-dining-db
    plan: free
    postgresMajorVersion: "16"

services:
  # Both services run images built once by CI (.github/workflows/ci.yml);
  # deploys pick the exact tag through the deploy hook's imgURL parameter.

  # Production: promoted manually from dev, backed by the managed Postgres.
  - type: web
    name: next-in-dining
    runtime: image
    image:
      url: ghcr.io/rasc88/next-in-dining:latest
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: next-in-dining-db
          property: connectionString

  # Development: deployed by CI on every push to main. Render's free plan
  # allows a single free Postgres, so dev uses the default SQLite file,
  # which is recreated (and re-seeded) on every deploy.
  - type: web
    name: next-in-dining-dev
    runtime: image
    image:
      url: ghcr.io/rasc88/next-in-dining:latest
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: development
