services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nid
      POSTGRES_PASSWORD: nid
      POSTGRES_DB: nid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nid -d nid"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nid:nid@db:5432/nid
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
