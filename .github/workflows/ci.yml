name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  compose-suite:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run docker-compose integration tests
        working-directory: backend
        run: |
          make install
          make test-integration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json
      - name: Run e2e tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  deploy:
    needs: [compose-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Wait for the new deploy to become healthy
        run: |
          for i in $(seq 1 40); do
            if curl -sf "${{ vars.RENDER_APP_URL }}/health"; then
              echo "Healthy"
              exit 0
            fi
            echo "Not ready yet (attempt $i/40), retrying in 15s..."
            sleep 15
          done
          echo "::error::Health check never succeeded after deploy"
          exit 1
