name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  compose-suite:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run docker-compose integration tests
        working-directory: backend
        run: |
          make install
          make test-integration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json
      - name: Run e2e tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  build:
    needs: [compose-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag (YYYYMMDD-HHMMSS-shortsha)
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Pushed \`${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Trigger Render deploy of the image to dev
        run: |
          img_url=$(jq -rn --arg v "$IMAGE:$TAG" '$v | @uri')
          curl -sf -X POST "${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}&imgURL=$img_url"
      - name: Wait for dev to serve this image
        run: |
          for i in $(seq 1 40); do
            version=$(curl -sf "${{ vars.RENDER_DEV_URL }}/health" | jq -r .version || true)
            if [ "$version" = "$TAG" ]; then
              echo "Dev is healthy and serving $TAG"
              exit 0
            fi
            echo "Dev serves '${version:-nothing}' (attempt $i/40), retrying in 15s..."
            sleep 15
          done
          echo "::error::Dev never started serving $TAG"
          exit 1
